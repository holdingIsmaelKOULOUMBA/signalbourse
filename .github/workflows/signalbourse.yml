name: SignalBourse - mise à jour automatique

on:
  schedule:
    # Heures UTC (Paris = UTC+1 l'hiver, UTC+2 l'été), du lundi au vendredi
    - cron: "40 6 * * 1-5"    # ≈ 7h40 Paris : avant l'ouverture
    - cron: "10 11 * * 1-5"   # ≈ 12h10 Paris : mi-séance
    - cron: "50 16 * * 1-5"   # ≈ 17h50 Paris : après la clôture européenne
    - cron: "20 21 * * 1-5"   # ≈ 22h20 Paris : après la clôture américaine
  workflow_dispatch: {}        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Analyse et génération du site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_bourse.py site
      - name: Publier
        run: |
          git config user.name "signalbourse-bot"
          git config user.email "signalbourse-bot@users.noreply.github.com"
          git add -A docs
          for f in historique_signaux.csv derniers_signaux.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Mise à jour $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Rien de nouveau"
          git push
