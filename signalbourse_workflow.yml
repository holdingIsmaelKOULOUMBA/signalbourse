name: SignalBourse - mise à jour automatique

on:
  schedule:
    # Heures UTC (Paris = UTC+1 l'hiver, UTC+2 l'été)
    - cron: "17 6-21 * * 1-5"   # toutes les heures, du lundi au vendredi, ≈ 7h17 → 22h17 Paris
    - cron: "40 6 * * 1"        # lundi ≈ 7h40 Paris : newsletter « Ta semaine »
    - cron: "10 17 * * 5"       # vendredi ≈ 18h10 Paris : newsletter « Bilan de la semaine »
    - cron: "17 10 * * 0,6"     # week-end : une mise à jour par jour (crypto, actualités)
  workflow_dispatch:
    inputs:
      newsletter:
        description: "Envoyer une newsletter de test ? (vide, lundi ou bilan)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: signalbourse
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyse et génération du site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NEWSLETTER: ${{ github.event.inputs.newsletter || (github.event.schedule == '40 6 * * 1' && 'lundi') || (github.event.schedule == '10 17 * * 5' && 'bilan') || '' }}
        run: python signal_bourse.py site
      - name: Publier
        run: |
          git config user.name "signalbourse-bot"
          git config user.email "signalbourse-bot@users.noreply.github.com"
          git add -A docs
          for f in historique_signaux.csv derniers_signaux.json univers_auto.json fonds_13f.json selection.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Mise à jour $(date +'%Y-%m-%d %H:%M')" || { echo "Rien de nouveau"; exit 0; }
          git pull --rebase -X theirs origin main || true
          git push
